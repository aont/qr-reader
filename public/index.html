<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Code reader</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.45 system-ui, sans-serif; --accent: #1769aa; --line: #a5abb2; --panel: #f4f5f6; --ink: #1f2328; }
    @media (prefers-color-scheme: dark) { :root { --accent: #75bfff; --line: #59616a; --panel: #20252a; --ink: #f0f3f6; } }
    * { box-sizing: border-box; }
    body { color: var(--ink); margin: 0 auto; max-width: 1100px; padding: 1.25rem; }
    h1 { font-size: 1.65rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.2rem; margin: 0; }
    p { margin: .4rem 0; }
    .subtle, #formats { color: color-mix(in srgb, currentColor 68%, transparent); font-size: .9rem; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: .4rem; margin: 1rem 0; padding: 1rem; }
    .controls { align-items: end; display: flex; flex-wrap: wrap; gap: .75rem; }
    label { display: grid; font-weight: 600; gap: .25rem; }
    button, select, input { font: inherit; }
    button, select, input[type=file], input[type=number] { border: 1px solid var(--line); border-radius: .3rem; padding: .48rem .65rem; }
    button { background: Canvas; color: CanvasText; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    input[type=number] { max-width: 8rem; }
    #status { min-height: 1.5rem; }
    #status[data-kind=error] { color: #c62828; }
    #status[data-kind=busy] { color: var(--accent); }
    #preview { background: #111; display: none; margin-top: 1rem; max-height: 55vh; max-width: 100%; width: auto; }
    .crop-controls { margin-top: 1rem; }
    .crop-controls input { width: 6rem; }
    .crop-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
    .results-head { align-items: center; display: flex; justify-content: space-between; }
    #empty { border: 1px dashed var(--line); padding: 1.5rem; text-align: center; }
    #results { display: grid; gap: 1rem; list-style: none; padding: 0; }
    .result { border: 1px solid var(--line); border-radius: .4rem; display: grid; gap: 1rem; grid-template-columns: minmax(220px, 38%) 1fr; padding: .8rem; }
    .snapshot { margin: 0; position: relative; width: 100%; }
    .snapshot img { display: block; height: auto; width: 100%; }
    .snapshot svg { height: 100%; inset: 0; pointer-events: none; position: absolute; width: 100%; }
    .snapshot polygon, .snapshot rect { fill: rgba(255, 214, 10, .2); stroke: #ffd60a; stroke-width: 4; vector-effect: non-scaling-stroke; }
    .value { overflow-wrap: anywhere; white-space: pre-wrap; }
    .meta { display: grid; gap: .25rem; grid-template-columns: max-content 1fr; margin: .6rem 0; }
    .meta dt { font-weight: 700; }
    .meta dd { margin: 0; }
    #toasts { display: grid; gap: .5rem; position: fixed; right: 1rem; top: 1rem; z-index: 10; }
    .toast { background: var(--ink); border-radius: .3rem; color: Canvas; max-width: 22rem; padding: .7rem 1rem; box-shadow: 0 2px 10px #0005; }
    @media (max-width: 650px) { .result { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Code reader</h1>
    <p class="subtle">Read barcodes locally from images, a camera, or a shared screen. Nothing is uploaded.</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="setup-title">
      <h2 id="setup-title">Reader setup</h2>
      <div class="controls">
        <label>Decoder
          <select id="decoder">
            <option value="native">Native BarcodeDetector</option>
            <option value="zxing">ZXing-C++ WASM</option>
          </select>
        </label>
        <label>Delay between frames (seconds)
          <input id="delay" type="number" min="0" max="60" step="0.05" value="0.25">
        </label>
      </div>
      <p id="formats" aria-live="polite">Checking supported formats…</p>
    </section>

    <section class="panel" aria-labelledby="input-title">
      <h2 id="input-title">Input</h2>
      <div class="controls">
        <label>Image files
          <input id="files" type="file" accept="image/*" multiple>
        </label>
        <button id="camera" type="button">Start camera</button>
        <button id="screen" type="button">Share screen/window/tab</button>
        <button id="stop" type="button" disabled>Stop capture</button>
      </div>
      <p id="status" role="status" aria-live="polite">Ready.</p>
      <div class="crop-controls">
        <div class="controls">
          <label>Left <input id="crop-left" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
          <label>Right <input id="crop-right" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
          <label>Top <input id="crop-top" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
          <label>Bottom <input id="crop-bottom" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
        </div>
        <div class="crop-actions" aria-label="Crop navigation controls">
          <button type="button" data-crop-action="zoom-in">Zoom In</button>
          <button type="button" data-crop-action="zoom-out">Zoom Out</button>
          <button type="button" data-crop-action="left">Left</button>
          <button type="button" data-crop-action="right">Right</button>
          <button type="button" data-crop-action="up">Up</button>
          <button type="button" data-crop-action="down">Down</button>
          <button type="button" data-crop-action="reset">Reset</button>
          <button id="scan-crop" class="primary" type="button" disabled>Scan crop</button>
        </div>
      </div>
      <canvas id="preview" aria-label="Cropped input preview"></canvas>
      <video id="media-source" autoplay muted playsinline hidden></video>
    </section>

    <section aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">Detection history</h2>
        <button id="clear" type="button">Clear results</button>
      </div>
      <p id="empty">No codes detected yet.</p>
      <ol id="results"></ol>
    </section>
  </main>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module">
    const $ = (selector) => document.querySelector(selector);
    const ui = {
      decoder: $('#decoder'), delay: $('#delay'), formats: $('#formats'), files: $('#files'),
      camera: $('#camera'), screen: $('#screen'), stop: $('#stop'), status: $('#status'),
      preview: $('#preview'), mediaSource: $('#media-source'), clear: $('#clear'), results: $('#results'), empty: $('#empty'),
      toasts: $('#toasts'), scanCrop: $('#scan-crop'), crop: {
        left: $('#crop-left'), right: $('#crop-right'), top: $('#crop-top'), bottom: $('#crop-bottom')
      }
    };
    const canvas = ui.preview;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    const history = new Map();
    let activeStream = null;
    let currentImage = null;
    let detectionRunning = false;
    let refreshPending = false;
    let runId = 0;

    const ZXING_VERSION = '3.1.4';
    const ZXING_MODULE = `https://cdn.jsdelivr.net/npm/zxing-wasm@${ZXING_VERSION}/dist/es/reader/index.js`;
    const ZXING_WASM = `https://cdn.jsdelivr.net/npm/zxing-wasm@${ZXING_VERSION}/dist/reader/zxing_reader.wasm`;

    // Decoder adapters expose a small common interface, so another backend only needs init/decode methods.
    const decoders = {
      native: {
        label: 'Native BarcodeDetector', detector: null, formats: [],
        async init() {
          if (!('BarcodeDetector' in window)) throw new Error('BarcodeDetector is not supported by this browser.');
          this.formats = typeof BarcodeDetector.getSupportedFormats === 'function'
            ? await BarcodeDetector.getSupportedFormats() : [];
          this.detector = new BarcodeDetector(this.formats.length ? { formats: this.formats } : undefined);
          return this.formats;
        },
        async decode(source) {
          const found = await this.detector.detect(source);
          return found.map(item => ({
            value: item.rawValue, format: item.format || 'unknown',
            boundingBox: item.boundingBox ? boxObject(item.boundingBox) : null,
            cornerPoints: normalizePoints(item.cornerPoints)
          }));
        }
      },
      zxing: {
        label: 'ZXing-C++ WASM', module: null,
        async init() {
          if (!this.module) {
            this.module = await import(ZXING_MODULE).catch(error => {
              throw new Error(`ZXing-C++ could not be loaded: ${error.message || error}`);
            });
            try {
              await this.module.prepareZXingModule({
                overrides: { locateFile: file => file.endsWith('.wasm') ? ZXING_WASM : file },
                fireImmediately: true
              });
            } catch (error) {
              this.module = null;
              throw new Error(`ZXing-C++ could not be loaded: ${error.message || error}`);
            }
          }
          return Array.from(this.module.READABLE_BARCODE_FORMATS || this.module.readableBarcodeFormats || [
            'Aztec', 'Codabar', 'Code39', 'Code93', 'Code128', 'DataBar', 'DataMatrix',
            'DXFilmEdge', 'EAN8', 'EAN13', 'ITF', 'MaxiCode', 'PDF417', 'QRCode', 'Telepen', 'UPCA', 'UPCE'
          ]);
        },
        async decode(source) {
          const data = source instanceof ImageData ? source : imageDataFrom(source);
          const found = await this.module.readBarcodes(data, { formats: [], maxNumberOfSymbols: 0 });
          return found.filter(item => !item.error).map(item => {
            const points = item.position ? [item.position.topLeft, item.position.topRight,
              item.position.bottomRight, item.position.bottomLeft] : [];
            return { value: item.text, format: item.format || 'unknown',
              cornerPoints: normalizePoints(points), boundingBox: boxFromPoints(points) };
          });
        }
      }
    };

    function normalizePoints(points) {
      return Array.from(points || []).filter(point => Number.isFinite(point.x) && Number.isFinite(point.y))
        .map(point => ({ x: point.x, y: point.y }));
    }
    function boxObject(box) {
      return { x: box.x, y: box.y, width: box.width, height: box.height };
    }
    function boxFromPoints(points) {
      const valid = normalizePoints(points);
      if (!valid.length) return null;
      const xs = valid.map(p => p.x), ys = valid.map(p => p.y);
      return { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
    }
    function imageDataFrom(source) {
      if (source !== canvas) drawSource(source);
      return context.getImageData(0, 0, canvas.width, canvas.height);
    }
    function sourceDimensions(source) {
      return {
        width: Math.max(0, Math.floor(source?.videoWidth || source?.naturalWidth || source?.width || 0)),
        height: Math.max(0, Math.floor(source?.videoHeight || source?.naturalHeight || source?.height || 0))
      };
    }
    function numericCropValue(edge) {
      const value = Number(ui.crop[edge].value);
      return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
    }
    function cropRectangle(source, updateInputs = true) {
      const { width, height } = sourceDimensions(source);
      if (!width || !height) return null;
      const crop = {
        left: Math.min(numericCropValue('left'), width - 1),
        right: numericCropValue('right'),
        top: Math.min(numericCropValue('top'), height - 1),
        bottom: numericCropValue('bottom')
      };
      crop.right = Math.min(crop.right, width - crop.left - 1);
      crop.bottom = Math.min(crop.bottom, height - crop.top - 1);
      if (updateInputs) {
        for (const edge of ['left', 'right', 'top', 'bottom']) ui.crop[edge].value = crop[edge];
      }
      return { ...crop, x: crop.left, y: crop.top,
        width: width - crop.left - crop.right, height: height - crop.top - crop.bottom,
        sourceWidth: width, sourceHeight: height };
    }
    function drawSource(source) {
      const crop = cropRectangle(source);
      if (!crop) return false;
      canvas.width = crop.width; canvas.height = crop.height;
      context.drawImage(source, crop.x, crop.y, crop.width, crop.height, 0, 0, crop.width, crop.height);
      canvas.style.display = 'block';
      return true;
    }
    function setStatus(message, kind = '') {
      ui.status.textContent = message; ui.status.dataset.kind = kind;
    }
    function friendlyError(error) {
      if (error?.name === 'NotAllowedError') return 'Permission was denied or the selection was cancelled.';
      if (error?.name === 'NotFoundError') return 'No suitable camera or capture source was found.';
      if (error?.name === 'NotReadableError') return 'The selected capture source is already in use or unavailable.';
      return error?.message || String(error);
    }
    function toast(value) {
      const node = document.createElement('div');
      node.className = 'toast'; node.textContent = `New code: ${value}`;
      ui.toasts.append(node);
      setTimeout(() => node.remove(), 3500);
    }

    async function selectDecoder(showBusy = true) {
      const adapter = decoders[ui.decoder.value];
      if (showBusy) ui.formats.textContent = `Loading ${adapter.label}…`;
      try {
        const formats = await adapter.init();
        ui.formats.textContent = formats.length
          ? `Supported formats (${formats.length}): ${formats.join(', ')}`
          : 'Supported formats: browser does not expose a format list.';
        return adapter;
      } catch (error) {
        ui.formats.textContent = friendlyError(error);
        throw error;
      }
    }

    async function snapshot() {
      return { url: canvas.toDataURL('image/jpeg', .88), width: canvas.width, height: canvas.height };
    }
    async function recordDetections(detections) {
      if (!detections.length) return;
      const captured = await snapshot();
      const now = new Date();
      for (const detection of detections) {
        if (typeof detection.value !== 'string') continue;
        const key = `${detection.format}\u0000${detection.value}`;
        const existing = history.get(key);
        if (existing) {
          existing.last = now; existing.count += 1; updateResult(existing);
        } else {
          const entry = { key, ...detection, first: now, last: now, count: 1, snapshot: captured };
          history.set(key, entry); renderResult(entry); toast(entry.value);
        }
      }
      ui.empty.hidden = history.size > 0;
    }

    async function detectCanvas(adapter) {
      // The caller always awaits this promise; detection can therefore never overlap.
      detectionRunning = true;
      try {
        const detections = await adapter.decode(canvas);
        await recordDetections(detections);
        return detections.length;
      } finally {
        detectionRunning = false;
        if (refreshPending) { refreshPending = false; refreshPreview(); }
      }
    }
    const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

    async function startMedia(kind) {
      stopCapture();
      if (!window.isSecureContext) {
        setStatus('Camera and screen capture require a secure HTTPS context.', 'error'); return;
      }
      const method = kind === 'camera' ? navigator.mediaDevices?.getUserMedia : navigator.mediaDevices?.getDisplayMedia;
      if (!method) {
        setStatus(`${kind === 'camera' ? 'Camera' : 'Screen capture'} is not supported by this browser.`, 'error'); return;
      }
      let adapter;
      try { adapter = await selectDecoder(false); }
      catch (error) { setStatus(friendlyError(error), 'error'); return; }
      const id = ++runId;
      try {
        activeStream = await method.call(navigator.mediaDevices, kind === 'camera'
          ? { video: { facingMode: { ideal: 'environment' } }, audio: false }
          : { video: true, audio: false });
        if (id !== runId) { activeStream.getTracks().forEach(track => track.stop()); return; }
        ui.mediaSource.srcObject = activeStream;
        await ui.mediaSource.play();
        activeStream.getVideoTracks()[0]?.addEventListener('ended', () => stopCapture('Capture ended.'));
        setCaptureControls(true); setStatus('Capturing and scanning…', 'busy');
        while (id === runId && activeStream?.active) {
          if (ui.mediaSource.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && ui.mediaSource.videoWidth) {
            drawSource(ui.mediaSource);
            await detectCanvas(adapter);
          }
          const seconds = Math.max(0, Number(ui.delay.value) || 0);
          await wait(seconds * 1000);
        }
      } catch (error) {
        if (id === runId) setStatus(friendlyError(error), 'error');
      } finally {
        if (id === runId) stopCapture(ui.status.dataset.kind === 'error' ? undefined : 'Capture stopped.');
      }
    }

    function setCaptureControls(running) {
      ui.stop.disabled = !running; ui.camera.disabled = running; ui.screen.disabled = running;
      ui.files.disabled = running; ui.decoder.disabled = running;
      ui.scanCrop.disabled = running || !currentImage;
    }
    function stopCapture(message) {
      runId += 1;
      if (activeStream) activeStream.getTracks().forEach(track => track.stop());
      activeStream = null; ui.mediaSource.pause(); ui.mediaSource.srcObject = null;
      if (currentImage && !detectionRunning) drawSource(currentImage);
      else if (!currentImage) ui.preview.style.display = 'none';
      setCaptureControls(false);
      if (message) setStatus(message);
    }

    async function loadImage(file) {
      if ('createImageBitmap' in window) return createImageBitmap(file);
      const url = URL.createObjectURL(file);
      try {
        const image = new Image(); image.src = url; await image.decode(); return image;
      } finally { URL.revokeObjectURL(url); }
    }
    async function handleFiles() {
      stopCapture();
      const files = Array.from(ui.files.files || []);
      if (!files.length) return;
      ui.files.disabled = true; ui.camera.disabled = true; ui.screen.disabled = true; ui.decoder.disabled = true; ui.scanCrop.disabled = true;
      try {
        const adapter = await selectDecoder(false);
        for (let index = 0; index < files.length; index++) {
          setStatus(`Scanning image ${index + 1} of ${files.length}…`, 'busy');
          let image;
          try {
            image = await loadImage(files[index]);
            currentImage?.close?.(); currentImage = image; image = null;
            drawSource(currentImage);
            const count = await detectCanvas(adapter);
            setStatus(`${files[index].name}: ${count} code${count === 1 ? '' : 's'} found.`);
          } catch (error) {
            setStatus(`Could not scan ${files[index].name}: ${friendlyError(error)}`, 'error');
          } finally { image?.close?.(); }
        }
      } catch (error) { setStatus(friendlyError(error), 'error'); }
      finally { ui.files.value = ''; setCaptureControls(false); }
    }

    function activeSource() {
      return activeStream?.active ? ui.mediaSource : currentImage;
    }
    function refreshPreview() {
      const source = activeSource();
      if (!source) {
        // Still sanitize manually-entered values before a source is available.
        for (const edge of ['left', 'right', 'top', 'bottom']) ui.crop[edge].value = numericCropValue(edge);
        return;
      }
      if (detectionRunning) { refreshPending = true; return; }
      drawSource(source);
    }
    function setCrop(crop) {
      for (const edge of ['left', 'right', 'top', 'bottom']) ui.crop[edge].value = Math.max(0, Math.floor(crop[edge] || 0));
      refreshPreview();
    }
    function navigateCrop(action) {
      if (action === 'reset') { setCrop({ left: 0, right: 0, top: 0, bottom: 0 }); return; }
      const source = activeSource();
      const crop = source && cropRectangle(source);
      if (!crop) return;
      const stepX = Math.max(1, Math.round(crop.sourceWidth * .05));
      const stepY = Math.max(1, Math.round(crop.sourceHeight * .05));
      if (action === 'zoom-in') {
        const x = Math.min(stepX, Math.floor((crop.width - 1) / 2));
        const y = Math.min(stepY, Math.floor((crop.height - 1) / 2));
        crop.left += x; crop.right += x; crop.top += y; crop.bottom += y;
      } else if (action === 'zoom-out') {
        crop.left = Math.max(0, crop.left - stepX); crop.right = Math.max(0, crop.right - stepX);
        crop.top = Math.max(0, crop.top - stepY); crop.bottom = Math.max(0, crop.bottom - stepY);
      } else if (action === 'left') {
        const amount = Math.min(stepX, crop.left); crop.left -= amount; crop.right += amount;
      } else if (action === 'right') {
        const amount = Math.min(stepX, crop.right); crop.left += amount; crop.right -= amount;
      } else if (action === 'up') {
        const amount = Math.min(stepY, crop.top); crop.top -= amount; crop.bottom += amount;
      } else if (action === 'down') {
        const amount = Math.min(stepY, crop.bottom); crop.top += amount; crop.bottom -= amount;
      }
      setCrop(crop);
    }
    async function scanCurrentCrop() {
      const source = currentImage;
      if (!source || activeStream || detectionRunning) return;
      ui.scanCrop.disabled = true;
      try {
        const adapter = await selectDecoder(false);
        drawSource(source);
        const count = await detectCanvas(adapter);
        setStatus(`${count} code${count === 1 ? '' : 's'} found in the current crop.`);
      } catch (error) { setStatus(friendlyError(error), 'error'); }
      finally { ui.scanCrop.disabled = false; }
    }

    function validWebUrl(value) {
      try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? url.href : null; }
      catch { return null; }
    }
    function renderResult(entry) {
      const item = document.createElement('li'); item.className = 'result'; item.dataset.key = entry.key;
      const figure = document.createElement('figure'); figure.className = 'snapshot';
      const image = new Image(); image.src = entry.snapshot.url; image.alt = `First detection of ${entry.format}`;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${entry.snapshot.width} ${entry.snapshot.height}`);
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet'); svg.setAttribute('aria-hidden', 'true');
      if (entry.cornerPoints?.length >= 3) {
        const polygon = document.createElementNS(svg.namespaceURI, 'polygon');
        polygon.setAttribute('points', entry.cornerPoints.map(p => `${p.x},${p.y}`).join(' ')); svg.append(polygon);
      } else if (entry.boundingBox) {
        const rect = document.createElementNS(svg.namespaceURI, 'rect');
        for (const attr of ['x', 'y', 'width', 'height']) rect.setAttribute(attr, entry.boundingBox[attr]);
        svg.append(rect);
      }
      figure.append(image, svg);
      const info = document.createElement('div');
      const value = document.createElement('p'); value.className = 'value';
      const url = validWebUrl(entry.value);
      if (url) { const link = document.createElement('a'); link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = entry.value; value.append(link); }
      else value.textContent = entry.value || '(empty value)';
      const meta = document.createElement('dl'); meta.className = 'meta';
      meta.innerHTML = '<dt>Format</dt><dd class="format"></dd><dt>First detected</dt><dd class="first"></dd><dt>Last detected</dt><dd class="last"></dd><dt>Count</dt><dd class="count"></dd>';
      const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'Copy value';
      copy.addEventListener('click', () => copyValue(entry.value, copy));
      info.append(value, meta, copy); item.append(figure, info); ui.results.prepend(item); updateResult(entry);
    }
    function updateResult(entry) {
      const item = Array.from(ui.results.children).find(node => node.dataset.key === entry.key);
      if (!item) return;
      item.querySelector('.format').textContent = entry.format;
      item.querySelector('.first').textContent = entry.first.toLocaleString();
      item.querySelector('.last').textContent = entry.last.toLocaleString();
      item.querySelector('.count').textContent = entry.count.toLocaleString();
    }
    async function copyValue(value, button) {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard access is unavailable.');
        await navigator.clipboard.writeText(value); button.textContent = 'Copied';
        setTimeout(() => { button.textContent = 'Copy value'; }, 1500);
      } catch (error) { setStatus(`Copy failed: ${friendlyError(error)}`, 'error'); }
    }

    ui.decoder.addEventListener('change', () => selectDecoder().catch(() => {}));
    ui.files.addEventListener('change', handleFiles);
    ui.camera.addEventListener('click', () => startMedia('camera'));
    ui.screen.addEventListener('click', () => startMedia('screen'));
    ui.stop.addEventListener('click', () => stopCapture('Capture stopped.'));
    ui.scanCrop.addEventListener('click', scanCurrentCrop);
    for (const input of Object.values(ui.crop)) input.addEventListener('input', refreshPreview);
    document.querySelector('.crop-actions').addEventListener('click', event => {
      const action = event.target.closest('[data-crop-action]')?.dataset.cropAction;
      if (action) navigateCrop(action);
    });
    ui.clear.addEventListener('click', () => { history.clear(); ui.results.replaceChildren(); ui.empty.hidden = false; setStatus('Detection history cleared.'); });
    window.addEventListener('pagehide', () => stopCapture());

    if (!window.isSecureContext) setStatus('Use HTTPS to enable camera, screen capture, and clipboard features.', 'error');
    selectDecoder().catch(() => {});
  </script>
</body>
</html>
